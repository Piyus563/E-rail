services:
  - type: web
    name: railsaathi
    env: python
    plan: free
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: e-rail.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://e-rail.onrender.com
      - key: SITE_URL
        value: https://e-rail.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://e-rail.onrender.com
